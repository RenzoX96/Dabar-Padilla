<title>Dabar Padilla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hebreo I, Sesión 3: estado constructo, pronombres y sufijos pronominales. Teoría, flashcards con repaso espaciado, práctica por niveles y simulacro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dabar Padilla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Noto+Serif+Hebrew:wght@400;600;700&display=swap">
<style>
/* Layout: app de estudio móvil primero; cabecera, una vista a la vez, barra de pestañas fija abajo. Sistema "Dabar Padilla" (tema único crema). */
:root{
  color-scheme: light;
  --crema:#fffdf4; --cielo-claro:#d6e9fb; --tinta:#4a1015; --tinta-suave:#7a4a4c;
  --cielo:#7eb9f2; --miel:#fef1af; --verde:#3e9c4e; --verde-oscuro:#2e7d3c;
  --azul:#4373f3; --azul-oscuro:#2f5bd6; --lila:#ab69e4; --lila-oscuro:#8a46c8;
  --naranja:#ff7b03; --coral:#ff5658; --lima:#dae979; --rosa:#ffd3ce;
  --display: Poppins, "Arial Black", sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --hebrew: "Noto Serif Hebrew", "SBL Hebrew", "Ezra SIL", "Times New Roman", serif;
  --r-md:16px; --r-lg:28px; --r-pill:999px; --trazo:3px;
}
*{box-sizing:border-box}
html,body{background:var(--crema);color:var(--tinta)}
body{font-family:var(--sans);font-size:17px;line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--crema)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.he{font-family:var(--hebrew);direction:rtl;unicode-bidi:isolate;font-size:1.15em;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--crema);border-bottom:2px solid var(--cielo-claro)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.logo small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--tinta-suave);letter-spacing:0;margin-left:6px}
.top .spacer{flex:1}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tinta-suave);opacity:.0;transition:opacity .3s}
.saved.on{opacity:1}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--verde-oscuro);display:inline-block}
.iconbtn{border:var(--trazo) solid var(--tinta);background:var(--crema);width:38px;height:38px;border-radius:50%;font-weight:700;display:grid;place-items:center}

main{padding-block:20px 24px;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.02;letter-spacing:-.015em}
h2{font-size:24px;line-height:30px;font-weight:650}
h3{font-size:19px;line-height:24px;font-weight:650}
p{margin:0}
.muted{color:var(--tinta-suave)}
.cap{font-size:13px;line-height:18px;color:var(--tinta-suave)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:6px 16px;font-size:15px;font-weight:600;line-height:20px;white-space:nowrap}
.pill.tilt{transform:rotate(-4deg)}
.pill.tilt2{transform:rotate(3deg)}
.p-verde{background:var(--verde-oscuro);color:var(--crema)}
.p-azul{background:var(--azul-oscuro);color:var(--crema)}
.p-lila{background:var(--lila-oscuro);color:var(--crema)}
.p-miel{background:var(--miel);color:var(--tinta)}
.p-lima{background:var(--lima);color:var(--tinta)}
.p-rosa{background:var(--rosa);color:var(--tinta)}
.p-line{background:var(--crema);color:var(--tinta);border:var(--trazo) solid var(--tinta)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}

/* Buttons */
.btn{border:var(--trazo) solid var(--tinta);background:var(--tinta);color:var(--crema);border-radius:var(--r-pill);padding:10px 22px;font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.ghost{background:var(--crema);color:var(--tinta)}
.btn.miel{background:var(--miel);color:var(--tinta)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--azul-oscuro);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Hero */
.hero{background:var(--cielo);border-radius:var(--r-lg);padding:24px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1 .hl{background:var(--miel);border-radius:14px;padding:0 10px;display:inline-block;transform:rotate(-2deg)}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .star{position:absolute;right:-18px;top:-18px;width:90px;height:90px;opacity:.9}
.ring{width:108px;height:108px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.ring .v small{display:block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.04em}
@media (max-width:480px){.hero{grid-template-columns:1fr}.hero .ringbox{justify-self:start}}

/* Cards / blocks */
.card{background:var(--cielo-claro);border-radius:var(--r-lg);padding:20px}
.card.crema{background:var(--crema);border:var(--trazo) solid var(--tinta)}
.card.miel{background:var(--miel)}
.card.rosa{background:var(--rosa)}
.card.lima{background:var(--lima)}
.card.sm{border-radius:var(--r-md);padding:16px}

/* Plan checklist */
.plan{display:grid;gap:10px;counter-reset:p}
.step{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--crema);border-radius:var(--r-md);padding:12px 14px;border:2px solid transparent}
.step .n{width:36px;height:36px;border-radius:50%;border:var(--trazo) solid var(--tinta);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.step.done .n{background:var(--verde-oscuro);border-color:var(--verde-oscuro);color:var(--crema)}
.step b{display:block;font-weight:650}
.step .cap{display:block}

/* Decks */
.deck{background:var(--crema);border:var(--trazo) solid var(--tinta);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:12px}
.deck-h{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.deck-badge{width:52px;height:52px;border-radius:var(--r-md);display:grid;place-items:center;font-family:var(--hebrew);font-size:26px;font-weight:700;color:var(--crema)}
.deck-h h3{font-size:18px}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.counts span{font-size:12.5px;font-weight:600;border-radius:var(--r-pill);padding:2px 10px;font-variant-numeric:tabular-nums}
.c-new{background:var(--cielo-claro)}.c-learn{background:var(--miel)}.c-done{background:var(--lima)}
.bar{height:10px;border-radius:var(--r-pill);background:var(--cielo-claro);overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde-oscuro);border-radius:var(--r-pill)}
.deck-actions{display:flex;gap:8px;flex-wrap:wrap}
.deck-actions .btn{min-height:40px;padding:8px 16px;font-size:15px}

/* Segmented tabs */
.seg{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:var(--trazo) solid var(--tinta);background:var(--crema);border-radius:var(--r-pill);padding:8px 16px;font-weight:600;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-selected="true"]{background:var(--tinta);color:var(--crema)}
.seg .tick{width:16px;height:16px;border-radius:50%;background:var(--verde-oscuro);display:inline-grid;place-items:center;color:var(--crema);font-size:11px}

/* Theory */
.t-sec{display:grid;gap:14px}
.t-sec p{max-width:65ch}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:var(--trazo) solid var(--tinta);background:var(--crema)}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th,td{padding:10px 12px;text-align:left;vertical-align:middle;border-bottom:1.5px solid var(--cielo-claro)}
th{background:var(--cielo-claro);font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:650}
tr:last-child td{border-bottom:0}
td .he{font-size:1.45em}
.suf{color:var(--crema);background:var(--verde-oscuro);border-radius:6px;padding:0 3px}
.suf.y{background:var(--lila-oscuro)}
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--crema);border-radius:var(--r-md);padding:12px 14px}
.rule .pill{margin-top:2px}

/* Chain diagram */
.chain{display:flex;flex-direction:row-reverse;justify-content:center;gap:10px;flex-wrap:wrap;align-items:stretch}
.link-box{border-radius:var(--r-md);padding:12px 16px;text-align:center;min-width:120px;display:grid;gap:4px}
.link-box .he{font-size:2em;line-height:1.3}
.link-box.c{background:var(--miel)}
.link-box.a{background:var(--tinta);color:var(--crema)}
.link-box.a .cap{color:var(--miel)}
.chain .arrow{align-self:center;font-weight:700;font-size:22px}
.readdir{display:flex;justify-content:center;gap:8px;align-items:center;font-size:13px;color:var(--tinta-suave)}

/* Flashcard */
.fc-top{display:flex;align-items:center;gap:10px}
.fc-top .bar{flex:1}
.fc-stage{position:relative;padding:10px 6px 6px}
.fc-stage::before{content:"";position:absolute;inset:18px 2px -2px 14px;background:var(--miel);border-radius:var(--r-lg);transform:rotate(2.2deg)}
.fc{position:relative;background:var(--crema);border:var(--trazo) solid var(--tinta);border-radius:var(--r-lg);min-height:330px;padding:22px 20px;display:grid;align-content:center;gap:14px;text-align:center}
.fc .front{font-family:var(--hebrew);direction:rtl;font-size:clamp(40px,11vw,62px);line-height:1.35;font-weight:600}
.fc .front.long{font-size:clamp(28px,7.5vw,42px)}
.fc .q{font-size:21px;font-weight:650;line-height:1.35}
.fc .tr{font-style:italic;color:var(--tinta-suave);font-size:16px}
.fc .es{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15}
.fc .an{display:grid;gap:6px;text-align:left;background:var(--cielo-claro);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.fc .an div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fc .tip{font-size:14px;text-align:left;background:var(--rosa);border-radius:var(--r-md);padding:10px 14px}
.fc .tag{justify-self:center}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{border:var(--trazo) solid var(--tinta);border-radius:var(--r-md);padding:10px 6px;display:grid;gap:2px;background:var(--crema);font-weight:700}
.rate button small{font-weight:500;font-size:12.5px;color:var(--tinta-suave)}
.rate .r1{background:var(--rosa)}.rate .r2{background:var(--lima)}.rate .r3{background:var(--cielo-claro)}
.rate-help{font-size:13px;color:var(--tinta-suave);text-align:center}

/* Exercises */
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.levels{grid-template-columns:1fr}}
.level{border:var(--trazo) solid var(--tinta);border-radius:var(--r-lg);padding:18px;background:var(--crema);text-align:left;display:grid;gap:8px;align-content:start}
.level .row{justify-content:space-between}
.level.wide{grid-column:1/-1;background:var(--miel)}
.level .pill{font-size:13px;padding:3px 12px}
.ex{display:grid;gap:16px}
.ex .prompt{font-size:19px;font-weight:650;line-height:1.35}
.ex .big{font-family:var(--hebrew);direction:rtl;text-align:center;font-size:clamp(34px,9vw,52px);font-weight:600;line-height:1.4;background:var(--miel);border-radius:var(--r-lg);padding:16px 12px}
.opts{display:grid;gap:10px}
.opt{border:var(--trazo) solid var(--tinta);background:var(--crema);border-radius:var(--r-md);padding:12px 14px;text-align:left;font-size:16px;line-height:1.45;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.opt .k{width:28px;height:28px;border-radius:50%;background:var(--cielo-claro);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.ok{background:var(--lima)}
.opt.ok .k{background:var(--verde-oscuro);color:var(--crema)}
.opt.bad{background:var(--rosa)}
.opt.bad .k{background:var(--tinta);color:var(--crema)}
.opt[disabled]{cursor:default}
.feedback{border-radius:var(--r-md);padding:14px 16px;display:grid;gap:6px}
.feedback.ok{background:var(--lima)}
.feedback.bad{background:var(--rosa)}
.feedback b{font-size:17px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.tile{border:var(--trazo) solid var(--tinta);background:var(--crema);border-radius:var(--r-md);padding:6px 14px;font-family:var(--hebrew);font-size:28px;line-height:1.4}
.tile.used{opacity:.3}
.built{min-height:72px;border:var(--trazo) dashed var(--tinta);border-radius:var(--r-lg);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:10px;direction:rtl;background:var(--crema)}
.built .tile{background:var(--miel)}
.built:empty::before{content:"Toca las palabras en orden";direction:ltr;font-family:var(--sans);font-size:14px;color:var(--tinta-suave)}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:12px;align-items:center;background:var(--crema);border-radius:var(--r-md);padding:8px 12px}
.part .he{font-size:1.5em;text-align:right}
.part span:last-child{font-size:14.5px}

/* Results */
.score{font-family:var(--display);font-weight:800;font-size:64px;line-height:1}
.miss{display:grid;gap:4px;background:var(--crema);border-radius:var(--r-md);padding:12px 14px;font-size:15px}

/* Progress */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--tinta-suave)}
.week i{width:30px;height:30px;border-radius:50%;border:2px solid var(--tinta);display:block}
.week i.on{background:var(--verde-oscuro);border-color:var(--verde-oscuro)}
.statrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.statrow .bar{grid-column:1/-1}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles3 .card{padding:14px;text-align:center;border-radius:var(--r-md)}
.tiles3 .num{font-family:var(--display);font-size:28px;display:block;line-height:1.1}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--crema);border-top:2px solid var(--cielo-claro);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px 8px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--tinta-suave);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--tinta)}
.tab[aria-current="page"] .ico{background:var(--miel)}
.tab .ico{border-radius:var(--r-pill);padding:3px 14px;display:grid;place-items:center}
.tab.center .ico{background:var(--tinta);color:var(--crema);width:58px;height:58px;border-radius:50%;margin-top:-26px;border:4px solid var(--crema);padding:0}
.tab.center[aria-current="page"] .ico{background:var(--verde-oscuro)}

/* Coach overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(74,16,21,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.coach{background:var(--crema);border-radius:var(--r-lg);max-width:440px;width:100%;padding:24px;display:grid;gap:14px;border:var(--trazo) solid var(--tinta)}
.coach .dots{display:flex;gap:6px}
.coach .dots i{width:8px;height:8px;border-radius:50%;background:var(--cielo-claro)}
.coach .dots i.on{background:var(--tinta)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--crema);border-radius:var(--r-pill);padding:10px 18px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .fc.flip{animation:flip .28s ease}
  @keyframes flip{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
  .view{animation:fade .2s ease}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>

<header class="top">
  <div class="wrap">
    <div class="logo">Dabar Padilla<small>Hebreo I · Sesión 3</small></div>
    <div class="spacer"></div>
    <span class="saved" id="saved"><i></i>Guardado</span>
    <button class="iconbtn" id="helpBtn" aria-label="Cómo usar la app">?</button>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="tabbar" aria-label="Secciones">
  <div class="wrap">
    <button class="tab" data-go="inicio"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Inicio</button>
    <button class="tab" data-go="teoria"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg></span>Teoría</button>
    <button class="tab center" data-go="estudiar" aria-label="Flashcards"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg></span>Flashcards</button>
    <button class="tab" data-go="practica"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg></span>Práctica</button>
    <button class="tab" data-go="progreso"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Progreso</button>
  </div>
</nav>

<script>
/* =========================================================
   CONTENIDO — Hebreo I, Sesión 3
   Transliteración según el sistema de Page H. Kelley.
   ========================================================= */

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function cardById(id){ const [d,i]=id.split("-"); const deck=DECKS.find(x=>x.id===d); return {deck, card:deck.cards[+i], id}; }

function deckStats(deck){
  const now=Date.now(); let nw=0, lr=0, dn=0, due=0, m=0;
  deck.cards.forEach((c,i)=>{ const st=S.cards[cid(deck.id,i)];
    if(!st){ nw++; return; }
    if(st.b>=3) dn++; else lr++;
    if(st.d<=now) due++;
    m += Math.min(st.b,3)/3;
  });
  return {nw, lr, dn, due, total:deck.cards.length, pct:Math.round(m/deck.cards.length*100)};
}
function overall(){
  let m=0,t=0; DECKS.forEach(d=>{ d.cards.forEach((c,i)=>{ const st=S.cards[cid(d.id,i)]; t++; if(st) m+=Math.min(st.b,3)/3; }); });
  return Math.round(m/t*100);
}

  let ids = []; decks.forEach(d=>d.cards.forEach((c,i)=>ids.push(cid(d.id,i))));
  const now = Date.now();
  if (mode==="smart"){
    const due = ids.filter(id=>S.cards[id] && S.cards[id].d<=now);
    const fresh = ids.filter(id=>!S.cards[id]);
    let pick = shuffle(due).concat(fresh).slice(0,25);
    if (!pick.length){ toast("Nada pendiente: modo repaso intensivo"); pick = ids; mode="all"; }
    ids = mode==="all" ? shuffle(ids) : pick;
  } else ids = shuffle(ids);
  if (deckId!=="all"){ S.last = deckId; save(); }
  fcS = {deck:deckId, mode, q:ids, i:0, flip:false, ok:0, again:0, total:ids.length};
  route="estudiar"; go("estudiar");
}
function vCard(){
  if (fcS.i >= fcS.q.length) return vCardDone();
  const {deck, card, id} = cardById(fcS.q[fcS.i]);
  const st = S.cards[id] || {b:0};
  const done = fcS.i, tot = fcS.q.length;
  const front = card.f
    ? `<div class="front ${card.f.length>14?"long":""}" lang="he">${esc(card.f)}</div>`
    : `<div class="q">${fmt(card.q)}</div>`;
  const back = fcS.flip ? `
    ${card.tr?`<div class="tr">${esc(card.tr)}</div>`:""}
    <div class="es">${fmt(card.es)}</div>
    ${card.ref?`<span class="pill p-miel tag">${esc(card.ref)}</span>`:""}
    ${card.an?`<div class="an">${card.an.map(a=>`<div>${fmt(a)}</div>`).join("")}</div>`:""}
    ${card.tip?`<div class="tip"><b>Recuerda:</b> ${fmt(card.tip)}</div>`:""}` : "";
  const nb = b => Math.min(b,5);
  return `
  <div class="fc-top">
    <button class="iconbtn" data-act="exitStudy" aria-label="Salir">✕</button>
    <div class="bar"><i style="width:${done/tot*100}%"></i></div>
    <span class="num cap">${done+1}/${tot}</span>
  </div>
  <div class="fc-stage"><div class="fc ${fcS.flip?"flip":""}" id="fc">
    <span class="pill tag" style="background:${deck.color};color:var(--crema)">${deck.short}</span>
    ${front}${back}
  </div></div>
  ${fcS.flip ? `
    <div class="rate">
      <button class="r1" data-rate="0">Otra vez<small>${INTV_LABEL[0]}</small></button>
      <button class="r2" data-rate="1">Bien<small>${INTV_LABEL[nb((st.b||0)+1)]}</small></button>
      <button class="r3" data-rate="2">Fácil<small>${INTV_LABEL[nb((st.b||0)+2)]}</small></button>
    </div>
    <p class="rate-help">Otra vez = no la sabía (vuelve en esta sesión) · Bien = la sabía · Fácil = sin pensar</p>`
  : `<button class="btn block" data-act="flip" style="min-height:54px">Mostrar respuesta</button>
     <p class="rate-help">Di la respuesta en voz alta antes de voltear. Atajo: barra espaciadora.</p>`}`;
}
function rate(r){
  const id = fcS.q[fcS.i]; const now = Date.now();
  const st = S.cards[id] || {b:0, d:0, n:0, l:0};
  st.n++;
  if (r===0){ st.b=0; st.l++; st.d=now+INTV[0]; fcS.again++;
    const pos = Math.min(fcS.q.length, fcS.i+4); fcS.q.splice(pos,0,id); }
  else { st.b = Math.min(5, st.b + (r===1?1:2)); st.d = now + INTV[st.b]; fcS.ok++; }
  S.cards[id]=st;
  const t = id.split("-")[0]; tally(t==="ver"?"ver":t, r>0);
  markDay(); save();
  fcS.i++; fcS.flip=false; render();
}
function vCardDone(){
  const name = fcS.deck==="all" ? "Todo mezclado" : DECKS.find(d=>d.id===fcS.deck).name;
  return `<section class="hero" style="grid-template-columns:1fr">${star}
    <span class="eyebrow" style="color:var(--tinta)">Sesión terminada</span>
    <h1>${esc(name)}</h1>
    <div class="row"><span class="pill p-verde tilt">${fcS.ok} acertadas</span><span class="pill p-line tilt2">${fcS.again} para repetir</span></div>
  </section>
  <div class="card stack"><p>Dominio general: <b>${overall()}%</b>. Las tarjetas marcadas «Otra vez» volverán primero la próxima vez.</p>
  <div class="row"><button class="btn" data-act="study" data-deck="${fcS.deck}" data-mode="all">Repetir el mazo</button><button class="btn ghost" data-act="exitStudy">Volver a los mazos</button><button class="btn miel" data-go-r="practica">Ir a práctica</button></div></div>`;
}

/* ---------- Práctica ---------- */
function vLevels(){
  const sim = S.sim;
  return `<div class="stack" style="gap:6px"><span class="eyebrow">Práctica helicoidal</span><h1>De lo fácil al examen</h1>
  <p class="muted">Los ejercicios de la pizarra, con su solución explicada, y más preguntas del mismo tipo.</p></div>
  <div class="levels">${LEVELS.map(l=>{ const r=S.lv[l.id];
    return `<button class="level ${l.id==="n5"?"wide":""}" data-act="level" data-level="${l.id}">
      <div class="row"><span class="eyebrow">${l.name}</span><span class="pill ${l.pill}">${l.diff}</span></div>
      <h3>${l.title}</h3>
      <span class="cap">${l.items.length} ejercicios · ${r?`mejor: <b class="num">${r.best}%</b>`:"sin intentar"}</span>
      <div class="bar"><i style="width:${r?r.best:0}%"></i></div>
    </button>`;}).join("")}</div>
  <section class="hero" style="grid-template-columns:1fr auto">
    <div class="stack" style="gap:8px;min-width:0"><span class="eyebrow" style="color:var(--tinta)">Simulacro</span>
      <h2 style="font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1">Examen de prueba</h2>
      <p>14 preguntas al azar de los cinco niveles, con traducción de versículos al final.</p>
      <div class="row"><button class="btn" data-act="sim">Empezar simulacro</button>${sim?`<span class="pill p-miel">Mejor: ${sim.best}%</span>`:""}</div></div>
  </section>`;
}
function startLevel(id){
  const L = LEVELS.find(l=>l.id===id);
  const items = (L.id==="n4" ? L.items.slice() : shuffle(L.items)).map(x=>Object.assign({topic:L.topic},x));
  exS = {kind:"level", id, title:L.name+" · "+L.title, items, i:0, done:false, score:0, wrong:[], pick:null, built:[]};
  go("practica");
}
function startSim(){
  const pool = [];
  LEVELS.filter(L=>L.id!=="n4").forEach(L=>L.items.forEach(x=>pool.push(Object.assign({topic:L.topic},x))));
  const n4 = LEVELS.find(L=>L.id==="n4");
  const items = shuffle(pool).slice(0,12).concat(shuffle(n4.items).slice(0,2).map(x=>Object.assign({topic:"ver"},x)));
  exS = {kind:"sim", id:"sim", title:"Simulacro de examen", items, i:0, done:false, score:0, wrong:[], pick:null, built:[]};
  go("practica");
}
function vEx(){
  if (exS.i >= exS.items.length) return vExDone();
  const it = exS.items[exS.i], n = exS.items.length;
  let body = "";
  if (it.t==="mc"){
    if (!it._o){ const ord = shuffle(it.o.map((o,k)=>k)); it._o = ord; }
    body = `${it.he?`<div class="big" lang="he">${esc(it.he)}</div>`:""}
      <p class="prompt">${fmt(it.q)}</p>
      <div class="opts">${it._o.map((k,j)=>{
        let cls=""; if(exS.done){ if(k===it.a) cls="ok"; else if(k===exS.pick) cls="bad"; }
        return `<button class="opt ${cls}" data-opt="${k}" ${exS.done?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${fmt(it.o[k])}</span></button>`; }).join("")}</div>`;
  } else if (it.t==="ord"){
    if (!it._t) it._t = shuffle(it.tiles);
    body = `<p class="prompt">${fmt(it.q)}</p>
      <div class="readdir">se escribe ← de derecha a izquierda</div>
      <div class="built" id="built">${exS.built.map((w,k)=>`<button class="tile" data-unb="${k}" ${exS.done?"disabled":""}>${esc(w)}</button>`).join("")}</div>
      <div class="tiles">${it._t.map((w,k)=>`<button class="tile ${exS.built.includes(w)?"used":""}" data-tile="${k}" ${exS.done||exS.built.includes(w)?"disabled":""}>${esc(w)}</button>`).join("")}</div>
      ${exS.done?"":`<div class="row" style="justify-content:center"><button class="btn ghost" data-act="clearB">Borrar</button><button class="btn" data-act="checkB" ${exS.built.length?"":"disabled"}>Comprobar</button></div>`}`;
  } else if (it.t==="rv"){
    const c = DECKS[4].cards[it.c];
    body = `<p class="prompt">Traduce al español e identifica cada elemento.</p>
      <div class="big" lang="he">${esc(c.f)}</div>
      ${c.ref?`<span class="pill p-miel" style="justify-self:start">${esc(c.ref)}</span>`:""}
      ${exS.reveal ? `<div class="card sm stack"><span class="cap" style="font-style:italic">${esc(c.tr)}</span>
          <p style="font-family:var(--display);font-weight:800;font-size:22px">«${esc(c.es)}»</p>
          <div class="parts">${c.an.map(a=>{const [w,...r]=a.split(" — ");return `<div class="part">${heb(w)}<span>${fmt(r.join(" — "))}</span></div>`;}).join("")}</div></div>
          ${exS.done?"":`<p class="prompt" style="font-size:16px">¿Tu traducción y tu análisis coincidían?</p>
          <div class="row"><button class="btn" data-self="1">Sí, lo tenía</button><button class="btn ghost" data-self="0">No del todo</button></div>`}`
        : `<p class="muted">Escríbela en tu cuaderno o dila en voz alta. Luego compara.</p><button class="btn block" data-act="reveal">Ver traducción y análisis</button>`}`;
  }
  let fb = "";
  if (exS.done){
    const ok = exS.lastOk;
    const msg = ok ? ["Correcto.","Exacto.","Bien visto."][exS.i%3] : ["Casi.","Revisa esto.","Aquí está la clave."][exS.i%3];
    const x = it.t==="rv" ? (ok?"Sigue así: este tipo de versículo es el que pide el profesor.":"Repasa el análisis palabra por palabra y vuelve a intentarlo luego.") : it.x;
    const sol = it.t==="ord" && !ok ? `<span>Respuesta: ${heb(it.ans.join(it.join??" "))}</span>` : "";
    fb = `<div class="feedback ${ok?"ok":"bad"}"><b>${msg}</b>${sol}<span>${fmt(x)}</span></div>
      <button class="btn block" data-act="next">${exS.i+1<n?"Siguiente":"Ver resultado"}</button>`;
  }
  return `<div class="fc-top"><button class="iconbtn" data-act="exitEx" aria-label="Salir">✕</button>
    <div class="bar"><i style="width:${exS.i/n*100}%"></i></div><span class="num cap">${exS.i+1}/${n}</span></div>
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(exS.title)}</span><span class="pill p-line" style="font-size:13px;padding:2px 12px">${TOPICS[it.topic]}</span></div>
    <section class="ex">${body}${fb}</section>`;
}
function answer(ok){
  const it = exS.items[exS.i];
  exS.done = true; exS.lastOk = ok;
  if (ok) exS.score++; else exS.wrong.push(it);
  tally(it.topic, ok); markDay(); save(); render();
}
function next(){ exS.i++; exS.done=false; exS.pick=null; exS.built=[]; exS.reveal=false; render(); window.scrollTo(0,0); }
function vExDone(){
  const pct = Math.round(exS.score/exS.items.length*100);
  if (!exS.recorded){ exS.recorded = true;
  if (exS.kind==="level"){ const r=S.lv[exS.id]||{best:0,tries:0}; r.best=Math.max(r.best,pct); r.tries++; S.lv[exS.id]=r; }
  else { const r=S.sim||{best:0,tries:0}; r.best=Math.max(r.best,pct); r.tries++; r.lastPct=pct; S.sim=r; }
  save(); }
  const label = pct>=90?"Listo para el examen":pct>=70?"Vas bien":"Repasa y vuelve";
  const missed = exS.wrong.map(it=>{
    if (it.t==="rv"){ const c=DECKS[4].cards[it.c]; return `<div class="miss">${heb(c.f)}<span>«${esc(c.es)}»</span></div>`; }
    if (it.t==="ord") return `<div class="miss"><b>${fmt(it.q)}</b>${heb(it.ans.join(it.join??" "))}<span class="cap">${fmt(it.x)}</span></div>`;
    return `<div class="miss"><b>${it.he?heb(it.he)+" · ":""}${fmt(it.q)}</b><span>${fmt(it.o[it.a])}</span><span class="cap">${fmt(it.x)}</span></div>`;
  }).join("");
  const again = exS.kind==="sim" ? `data-act="sim"` : `data-act="level" data-level="${exS.id}"`;
  const res = `<section class="hero">${star}
    <div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--tinta)">${esc(exS.title)}</span>
      <div class="score">${pct}%</div><span class="pill p-verde tilt" style="justify-self:start">${label}</span>
      <span>${exS.score} de ${exS.items.length} correctas</span></div>
    <div class="ringbox">${ring(pct,"acierto")}</div></section>
    ${missed?`<section class="stack"><h2>Para repasar</h2>${missed}</section>`:`<div class="card lima"><b>Sin errores.</b> Prueba el siguiente nivel o el simulacro.</div>`}
    <div class="row"><button class="btn" ${again}>Intentar de nuevo</button><button class="btn ghost" data-act="exitEx">Volver a niveles</button></div>`;
  return res;
}

/* ---------- Progreso ---------- */
function vProgress(){
  const pct = overall();
  const nCards = Object.keys(S.cards).length, nTot = DECKS.reduce((a,d)=>a+d.cards.length,0);
  const rev = Object.values(S.cards).reduce((a,c)=>a+c.n,0);
  const days = []; for(let k=6;k>=0;k--){ const d=new Date(); d.setDate(d.getDate()-k); days.push(d); }
  const wd = ["D","L","M","M","J","V","S"];
  let streak=0; { const d=new Date(); while(S.days.includes(today(d))){ streak++; d.setDate(d.getDate()-1);} }
  const topics = Object.entries(TOPICS).map(([k,n])=>{ const r=S.top[k]; return {k,n,pct:r&&r.n?Math.round(r.ok/r.n*100):null, n2:r?r.n:0}; });
  const tried = topics.filter(t=>t.pct!==null && t.n2>=3).sort((a,b)=>a.pct-b.pct);
  const weak = tried[0];
  return `<div class="stack" style="gap:6px"><span class="eyebrow">Progreso</span><h1>Cómo vas</h1></div>
  <section class="hero">${star}
    <div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--tinta)">Dominio de la sesión</span>
      <h2 style="font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1">${pct>=80?"Muy bien preparado":pct>=50?"A medio camino":"Recién empiezas"}</h2>
      <span>${weak?`Tu tema más débil: <b>${weak.n}</b> (${weak.pct}%).`:"Responde unas preguntas para ver tu tema más débil."}</span></div>
    <div class="ringbox">${ring(pct,"dominio")}</div></section>

  <div class="tiles3">
    <div class="card"><span class="num">${nCards}<span class="cap">/${nTot}</span></span><span class="cap">tarjetas vistas</span></div>
    <div class="card miel"><span class="num">${rev}</span><span class="cap">repasos</span></div>
    <div class="card lima"><span class="num">${streak}</span><span class="cap">días seguidos</span></div>
  </div>

  <section class="card stack"><h3>Esta semana</h3>
    <div class="week">${days.map(d=>`<div><i class="${S.days.includes(today(d))?"on":""}"></i>${wd[d.getDay()]}</div>`).join("")}</div></section>

  <section class="card crema stack"><h3>Dominio por mazo</h3>
    ${DECKS.map(d=>{const s=deckStats(d); return `<div class="statrow"><span>${d.name}</span><span class="num">${s.pct}%</span><div class="bar"><i style="width:${s.pct}%;background:${d.color}"></i></div></div>`;}).join("")}</section>

  <section class="card crema stack"><h3>Acierto por tema</h3>
    ${topics.map(t=>`<div class="statrow"><span>${t.n} <span class="cap">${t.n2} respuestas</span></span><span class="num">${t.pct===null?"—":t.pct+"%"}</span><div class="bar"><i style="width:${t.pct||0}%"></i></div></div>`).join("")}</section>

  <section class="card crema stack"><h3>Niveles de práctica</h3>
    ${LEVELS.map(l=>{const r=S.lv[l.id];return `<div class="statrow"><span>${l.name} · ${l.title}</span><span class="num">${r?r.best+"%":"—"}</span></div>`;}).join("")}
    <div class="statrow"><span><b>Simulacro</b></span><span class="num">${S.sim?S.sim.best+"%":"—"}</span></div>
  </section>

  <section class="stack">
    <p class="cap">Tu progreso se guarda automáticamente en este navegador. Si cambias de dispositivo, empieza de cero.</p>
    ${S._confirmReset?`<div class="card rosa row" style="justify-content:space-between"><span>¿Borrar todo el progreso? No se puede deshacer.</span><div class="row"><button class="btn" data-act="resetYes">Sí, borrar</button><button class="btn ghost" data-act="resetNo">Cancelar</button></div></div>`
      :`<button class="link" data-act="reset" style="justify-self:start">Reiniciar progreso</button>`}
  </section>`;
}

/* ---------- Guía inicial ---------- */
const COACH = [
  ["Bienvenido a la Sesión 3","Esta app tiene todo lo de tu clase: estado constructo, pronombres y sufijos. El «Plan para hoy» del inicio te dice qué hacer y en qué orden."],
  ["Flashcards con repaso espaciado","Mira el hebreo, responde en voz alta y voltea. Luego elige: «Otra vez» si no la sabías (vuelve enseguida), «Bien» si la sabías, «Fácil» si fue inmediata. Las difíciles se repiten más."],
  ["Práctica y simulacro","Cuatro niveles como en la pizarra, cada respuesta con su explicación. Al final, un simulacro de examen. Todo se guarda solo: verás «Guardado» arriba."]
];
let coachI = 0;
function showCoach(){
  coachI = 0;
  const o = document.createElement("div"); o.className="overlay"; o.id="coach"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  document.body.appendChild(o); drawCoach();
}
function drawCoach(){
  const o = $("#coach"); const [t,d] = COACH[coachI];
  o.innerHTML = `<div class="coach"><div class="dots">${COACH.map((_,k)=>`<i class="${k===coachI?"on":""}"></i>`).join("")}</div>
    <span class="pill p-miel tilt" style="justify-self:start">Paso ${coachI+1}</span>
    <h2>${t}</h2><p>${d}</p>
    <div class="row" style="justify-content:space-between"><button class="link" data-coach="skip">Saltar</button>
    <button class="btn" data-coach="next">${coachI<COACH.length-1?"Siguiente":"Empezar"}</button></div></div>`;
  o.querySelector("[data-coach=next]").focus();
}
function closeCoach(){ const o=$("#coach"); if(o) o.remove(); S.onb=true; save(); }

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.coach){ if (d.coach==="skip"||coachI>=COACH.length-1) closeCoach(); else { coachI++; drawCoach(); } return; }
  if (d.go){ if (d.go!=="estudiar") fcS=null; if (d.go!=="practica") exS=null; if (d.go==="estudiar") fcS=null; if (d.go==="practica") exS=null; go(d.go); return; }
  if (d.goR){ fcS=null; exS=null; go(d.goR); return; }
  if (d.plan){ if (d.plan==="sim") startSim(); else { fcS=null; exS=null; go(d.plan); } return; }
  if (d.th){ thTab=d.th; render(); return; }
  if (d.rate){ rate(+d.rate); return; }
  if (d.opt!==undefined && exS && !exS.done){ exS.pick=+d.opt; answer(+d.opt===exS.items[exS.i].a); return; }
  if (d.tile!==undefined && exS && !exS.done){ const it=exS.items[exS.i]; exS.built.push(it._t[+d.tile]); render(); return; }
  if (d.unb!==undefined && exS && !exS.done){ exS.built.splice(+d.unb,1); render(); return; }
  if (d.self!==undefined){ answer(d.self==="1"); return; }
  switch(d.act){
    case "study": startStudy(d.deck, d.mode); break;
    case "toggleDeck": openDeck = openDeck===d.deck?null:d.deck; render(); break;
    case "flip": fcS.flip=true; render(); break;
    case "exitStudy": fcS=null; go("estudiar"); break;
    case "level": if (d.level && (d.act==="level")) startLevel(d.level); break;
    case "sim": startSim(); break;
    case "exitEx": exS=null; go("practica"); break;
    case "next": next(); break;
    case "reveal": exS.reveal=true; render(); break;
    case "clearB": exS.built=[]; render(); break;
    case "checkB": { const it=exS.items[exS.i]; const j=it.join??" "; answer(exS.built.join(j)===it.ans.join(j)); break; }
    case "reset": S._confirmReset=true; render(); break;
    case "resetNo": S._confirmReset=false; render(); break;
    case "resetYes": S={cards:{},lv:{},sim:null,top:{},days:[],seen:{},onb:true,last:null}; save(); toast("Progreso reiniciado"); go("inicio"); break;
  }
});
document.addEventListener("keydown", e=>{
  if ($("#coach")) { if (e.key==="Escape") closeCoach(); return; }
  if (route==="estudiar" && fcS && fcS.i<fcS.q.length){
    if (!fcS.flip && (e.key===" "||e.key==="Enter")){ e.preventDefault(); fcS.flip=true; render(); }
    else if (fcS.flip && ["1","2","3"].includes(e.key)) rate(+e.key-1);
  }
});
$("#helpBtn").addEventListener("click", showCoach);
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if (["inicio","teoria","estudiar","practica","progreso"].includes(h) && h!==route){ fcS=null; exS=null; go(h); } });

/* Inicio */
(function(){
  const h = location.hash.slice(1);
  go(["inicio","teoria","estudiar","practica","progreso"].includes(h)?h:"inicio");
  if (!S.onb) showCoach();
})();
</script>
